# ArUco Marker Configuration
# =============================
# Centralized config for all markers and static frames in the system.
# The aruco_marker_manager node loads this at startup.
#
# All frames are defined relative to `world` (the canonical reference frame
# used by MoveIt planning, hand_pose publishing, and tool poses throughout
# the system). world and base are related by a 180 deg rotation around Z:
#   world_X = -base_X,  world_Y = -base_Y,  world_Z = base_Z
#
# For each marker:
#   - Static TF (world -> child_frame) is published from this config
#   - Detection node subscribes to the listed camera, and on first valid
#     detection publishes a static TF (child_frame -> camera_output_frame).
#
# Orientation convention:
#   rotation_rpy is [roll, pitch, yaw] in radians, applied as
#   R = Rz(yaw) * Ry(pitch) * Rx(roll) (standard ROS tf2 convention).

# ArUco dictionary used for all markers (cv2.aruco.DICT_ARUCO_ORIGINAL)
dictionary: "original"

markers:

  # ─── Marker 105: Reclaim tray camera localization (mounted on MiR side) ──────
  - name: "mir_side_marker"
    id: 105
    size: 0.115
    static_pose:
      parent_frame: "world"
      child_frame: "aruco_marker_105_frame"
      # x = 0.0: the marker sits exactly ON the x axis (measured, confirmed).
      # y = -0.44 in world (marker sits 44 cm along -y_world; = +y_base) (measured)
      # z = top_edge (-0.028) - size/2 (0.0575) = -0.0855  (center below base plane)
      # This pose is correct. The residual ~10 mm +x bias in everything this camera
      # reports is NOT from here — it comes from solvePnP on the oblique side view
      # (and the projection ignoring the lens distortion coefficients). It is
      # compensated by world_offset_xy in config/tray_geometry.yaml. Do not "fix"
      # it by nudging these numbers; they are measured.
      translation: [0.0, -0.44, -0.0855]
      # Axis mapping (marker frame -> world frame):
      #   marker_X -> +world_X
      #   marker_Y -> +world_Z  (up)
      #   marker_Z -> -world_Y  (points away from robot)
      # Equivalent RPY in ROS convention: (roll=pi/2, pitch=0, yaw=0)
      rotation_rpy: [1.5707963267948966, 0.0, 0.0]
    detection:
      camera_namespace: "/reclaim_tray_camera"
      camera_output_frame: "reclaim_tray_camera_color_optical_frame"
      publish_once: true
      # Run detectMarkers at most this often while searching (Hz). Keeps an
      # un-locked tracker from burning a core at the full ~25 Hz camera rate.
      search_rate_hz: 3.0
      # Lock on the smoothed pose over this many detections (median translation
      # + averaged quaternion) instead of a single, possibly-bad frame.
      lock_min_samples: 8

  # ─── Marker 110: Tray camera localization (mounted on world / tool side) ──
  - name: "tray_side_marker"
    id: 110
    size: 0.1
    static_pose:
      parent_frame: "world"
      child_frame: "aruco_marker_110_frame"
      # Marker sits 37.5 cm along -x_world and 1 cm along -z_world
      translation: [-0.375, 0.0, -0.01]
      # Axis mapping (marker frame -> world frame):
      #   marker_X -> -world_X
      #   marker_Y -> -world_Y
      #   marker_Z -> +world_Z  (up)
      # Equivalent RPY: 180 deg yaw (Rz(pi))
      rotation_rpy: [0.0, 0.0, 3.141592653589793]
    detection:
      camera_namespace: "/tray_camera"
      camera_output_frame: "tray_camera_color_optical_frame"
      publish_once: true
      # See marker 105 above for what these do.
      search_rate_hz: 3.0
      lock_min_samples: 8

# ─── Additional static frames (no detection, just fixed TFs) ─────────
static_frames:

  # Reclaim holder - new setup uses a fixed position, not derived from a marker
  - parent_frame: "world"
    child_frame: "tool_holder_frame"
    # TODO: measure reclaim-holder position in world frame
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]
