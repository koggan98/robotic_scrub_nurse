# Tool Knowledge Base
# Provides semantic information about surgical instruments for:
# - LLM context (tool calling, disambiguation, handover rules)
# - Grasp reasoning (grip strategy, orientation constraints)
# - OBB model class mapping
#
# Each entry maps an OBB model class name to its semantic properties.

tools:

  needle_holder:
    display_name: "Needle Holder"
    synonyms: ["needle driver", "nadelhalter"]
    description: "Clamping instrument for holding suture needles during stitching."
    variants:
      - "needle_holder_12mm"
      - "needle_holder_15mm"
    grip_strategy: "parallel"         # parallel | pinch | wrap
    handover_rule: "functional_end_away"
    handover_description: "Hand over with the clamping jaws pointing away from the surgeon."
    functional_end: "jaws"
    lift_height: 0.10                 # meters above tray surface

  scalpel:
    display_name: "Scalpel"
    synonyms: ["blade", "skalpell", "knife", "messer"]
    description: "Sharp cutting instrument with a blade."
    variants:
      - "scalpel_10"
      - "scalpel_15"
      - "scalpel_20"
    grip_strategy: "parallel"
    handover_rule: "blade_away"
    handover_description: "Hand over with the blade pointing away from the surgeon. Handle first."
    functional_end: "blade"
    lift_height: 0.10

  scissors:
    display_name: "Scissors"
    synonyms: ["schere", "mayo scissors", "metzenbaum", "metzenbaum scissors"]
    variants:
      - "scissors_straight"
      - "scissors_curved"
      - "scissors_long"
      - "scissors_short"
    description: "Cutting instrument with two blades."
    grip_strategy: "parallel"
    handover_rule: "functional_end_away"
    handover_description: "Hand over with cutting tips away from the surgeon."
    functional_end: "blades"
    lift_height: 0.10

  forceps:
    display_name: "Forceps"
    synonyms: ["pinzette", "tweezers", "tissue forceps", "adson", "debakey", "tweezer"]
    variants:
      - "forceps_big"
      - "forceps_mid"
      - "forceps_short"
      - "forceps_toothed"
      - "forceps_atraumatic"
    description: "Grasping instrument for holding tissue."
    grip_strategy: "parallel"
    handover_rule: "functional_end_away"
    handover_description: "Hand over with the tips pointing away from the surgeon."
    functional_end: "tips"
    lift_height: 0.10

  retractor:
    display_name: "Retractor"
    synonyms: ["haken", "wundhaken", "langenbeck", "army navy"]
    variants:
      - "retractor_small"
      - "retractor_large"
    description: "Instrument for holding back tissue to expose the surgical field."
    grip_strategy: "parallel"
    handover_rule: "neutral"
    handover_description: "Hand over with handle toward the surgeon, hook end away."
    functional_end: "hook"
    lift_height: 0.15

  hammer:
    display_name: "Hammer"
    synonyms: ["mallet", "surgical hammer", "hammer"]
    variants:
      - "hammer"
    description: "Impact instrument with a handle and striking head."
    grip_strategy: "parallel"
    handover_rule: "functional_end_away"
    handover_description: "Hand over with the hammer head away from the surgeon."
    functional_end: "head"
    lift_height: 0.10

  clamp:
    display_name: "Clamp"
    synonyms: ["klemme", "hemostat", "kocher", "pean", "mosquito"]
    variants:
      - "clamp_straight"
      - "clamp_curved"
    description: "Locking instrument for clamping blood vessels or tissue."
    grip_strategy: "parallel"
    handover_rule: "functional_end_away"
    handover_description: "Hand over with clamping jaws away from the surgeon."
    functional_end: "jaws"
    lift_height: 0.10

  awl:
     display_name: "Awl"
     synonyms: ["awl", "stechbeitel"]
     variants:
       - "awl"
     description: "Pointed instrument for making holes in bone."
     grip_strategy: "parallel"
     handover_rule: "functional_end_away"
     handover_description: "Hand over with the pointed end away from the surgeon."
     functional_end: "point"
     lift_height: 0.10


# Default fallback for unknown tool classes
default:
  grip_strategy: "parallel"
  handover_rule: "neutral"
  handover_description: "Hand over in neutral orientation."
  lift_height: 0.10


# ─────────────────────────────────────────────────────────────────────────────
# Grasp strategies — WHERE and HOW DEEP to grasp each instrument.
# Read by grasp_geometry_node (NOT by tool_semantics_node, which runs downstream
# of it and would arrive too late to influence the grasp point).
#
# KEYED ON THE RAW YOLO CLASS, deliberately. The `tools:` block above is keyed on
# canonical classes and collapses variants (forceps_big/mid/short all become
# "forceps"), which cannot express the split below — forceps_big and forceps_mid
# are TALL tools, forceps_short is a THIN one.
#
# The two distance rules reproduce grasp_point_utils.py exactly:
#   from_handle_inner_edge : handle OBB's inner edge (facing the tool) + distance_m
#                            (= the old "inner_plus" / "hammer_inner_plus")
#   from_handle_center     : handle OBB centre + distance_m
#                            (= the old "fallback", grasp_offset_m = 0.035)
#
# placement:
#   fixed   : the grasp point is critical and must NOT move. The hammer tips out
#             of the jaws if grasped off its centre of gravity; the awl slips.
#   sliding : the tool is long and thin, so it may be grasped anywhere along the
#             shaft (just not on the handle). We slide the grasp point along the
#             tool's long axis until it lies over the tray's OPENING, and only
#             then descend below the tray surface (z_offset_over_opening_m).
#
# z offsets are relative to the tray plane, on top of the executor's per-tray
# z_offset trim. Positive = shallower.
#
# ⚠ Going DEEPER than the tray surface is only ever allowed when the grasp point
# AND both fingertips are confirmed inside a measured opening (tray_geometry.yaml).
# MoveIt does not model the tray surface and will not stop a crash into a profile.
# ─────────────────────────────────────────────────────────────────────────────

grasp_strategies:

  default:
    placement: fixed
    distance_rule: from_handle_center
    distance_m: 0.035
    z_offset_m: 0.0

  # ── "Tall" tools: enough body height that the jaws already get a grip at the
  #    tray surface. 2 mm shallower keeps the fingertips off the profile while
  #    still biting; was 4 mm, lowered 2 mm for a firmer grip on the tall tools.
  #    Their grasp point is load-bearing — do not slide it. The hammer tips out
  #    of the jaws if grasped off its centre of gravity.

  hammer:
    placement: fixed
    distance_rule: from_handle_inner_edge   # was HAMMER_CENTER_OFFSET_M
    distance_m: 0.040                       # grasp near the centre of gravity
    z_offset_m: 0.000

  retractor:
    placement: fixed                        # always lies on its side
    distance_rule: from_handle_center
    distance_m: 0.035
    z_offset_m: 0.000

  forceps_big:
    placement: fixed
    distance_rule: from_handle_center
    distance_m: 0.035
    z_offset_m: 0.000

  forceps_mid:
    placement: fixed
    distance_rule: from_handle_center
    distance_m: 0.035
    z_offset_m: 0.000

  # ── "Flat" tools: so thin that the jaws only catch their top 2-3 mm at the
  #    tray surface, and they slip out. Long enough to be grasped anywhere along
  #    the shaft, so slide the grasp point into the opening and reach 4 mm deeper.
  #    z_offset_m (the fallback when the opening cannot be reached) stays at 0.0 —
  #    i.e. today's height, which is known to work.

  scissors_long:
    placement: sliding
    distance_rule: from_handle_inner_edge   # was CLASS_OFFSET_M
    distance_m: 0.020                       # preferred (= today's) distance
    slide_min_m: 0.020                      # never closer to the handle than this
    slide_max_m: 0.110
    tip_margin_m: 0.020                     # stay back from the functional end
    z_offset_m: -0.002                         # opening not reachable -> today's height
    z_offset_over_opening_m: -0.004         # over the opening -> 4 mm deeper

  scissors_short:
    placement: sliding
    distance_rule: from_handle_inner_edge
    distance_m: 0.020
    slide_min_m: 0.020
    slide_max_m: 0.080
    tip_margin_m: 0.020
    z_offset_m: -0.002
    z_offset_over_opening_m: -0.004

  needle_holder:
    placement: sliding
    distance_rule: from_handle_inner_edge
    distance_m: 0.020
    slide_min_m: 0.020
    slide_max_m: 0.100
    tip_margin_m: 0.020
    z_offset_m: -0.002
    z_offset_over_opening_m: -0.004

  awl:
    placement: sliding
    distance_rule: from_handle_center       # nominal = the old fixed grasp point,
    distance_m: 0.035                       # so nothing moves when it cannot slide
    slide_min_m: 0.025
    slide_max_m: 0.090
    tip_margin_m: 0.025                     # it is pointed — stay well off the tip
    z_offset_m: -0.002
    z_offset_over_opening_m: -0.004

  forceps_short:
    placement: sliding
    distance_rule: from_handle_center
    distance_m: 0.035
    slide_min_m: 0.025
    slide_max_m: 0.070
    tip_margin_m: 0.015
    z_offset_m: -0.002
    z_offset_over_opening_m: -0.004
