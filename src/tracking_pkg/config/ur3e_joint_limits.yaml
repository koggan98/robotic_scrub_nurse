# Joints limits
#
# Sources:
#
#  - Universal Robots e-Series, User Manual, UR3e, Version 5.8
#    https://s3-eu-west-1.amazonaws.com/ur-support-site/69043/99403_UR3e_User_Manual_en_Global.pdf
#  - Support > Articles > UR articles > Max. joint torques
#    https://www.universal-robots.com/articles/ur-articles/max-joint-torques
#    retrieved: 2020-06-16, last modified: 2020-06-09
joint_limits:
  shoulder_pan_joint:
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 56.0
    max_position: !degrees 360.0
    max_velocity: !degrees 180.0
    min_position: !degrees -20.0
  shoulder_lift_joint:
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 56.0
    max_position: !degrees 90.0
    max_velocity: !degrees 180.0
    min_position: !degrees -270.0
  elbow_joint:
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 28.0
    max_position: !degrees 180.0
    max_velocity: !degrees 180.0
    min_position: !degrees -90.0
  wrist_1_joint:
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 12.0
    max_position: !degrees 80.0
    max_velocity: !degrees 360.0
    min_position: !degrees -270.0
  wrist_2_joint:
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 12.0
    max_position: !degrees 90.0
    max_velocity: !degrees 360.0
    min_position: !degrees -180.0
  wrist_3_joint:
    has_acceleration_limits: false
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 12.0
    max_position: !degrees 200.0
    max_velocity: !degrees 360.0
    min_position: !degrees -200.0
