# Tool Catalog
# ============
# Display names and synonyms, keyed on the RAW YOLO class. The LLM's system prompt
# is built from this.
#
# WHY THIS EXISTS SEPARATELY FROM tool_knowledge_base.yaml:
# the KB's `tools:` block is keyed on CANONICAL classes and folds the variants into
# them — `scissors_long` and `scissors_short` both become "Scissors", and
# `forceps_big` / `forceps_mid` / `forceps_short` all become "Forceps". So the LLM
# was being told about three tools called "Forceps" and had no way to resolve
# "give me the small forceps". This file gives every raw class its own name.
#
# THIS IS A CATALOGUE, NOT AN INVENTORY. It says what a tool is called, not how
# many you own. The inventory of an operation is whatever is actually lying on the
# instrument tray when register_inventory runs — four tools is as valid a
# simulated operation as eleven.

catalog:

  scissors_long:
    display_name: "Long Scissors"
    synonyms:
      - "lange schere"
      - "long scissors"
      - "big scissors"
      - "mayo"
