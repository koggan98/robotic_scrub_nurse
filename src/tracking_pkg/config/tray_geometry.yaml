# Tray Geometry
# ==============
# Both trays are ITEM extrusion frames: a rectangle of profile bars with an OPEN
# HOLE in the middle. Tools lie across the frame, resting on the bars and spanning
# the hole. Over the hole the gripper may descend BELOW the tray surface and get a
# secure grip on a thin instrument; over a bar it would crash.
#
# WHY THIS IS STATIC, NOT DETECTED AT RUNTIME:
# the trays are bolted down and the camera poses are ArUco-locked once and then
# frozen (aruco_marker_manager, publish_once: true — it even drops its camera
# subscriptions after the lock). So each opening's pose in the world frame is a
# constant. Detecting it every frame would solve a static problem with a fragile
# dynamic method — and the profile edges are occluded by exactly the tools you are
# trying to grasp. (The instrument tray camera also has enable_depth: false, so a
# depth-based hole detection is not even possible there.)
#
# SAFETY: neither tray's support surface is a MoveIt collision object, so MoveIt
# will NOT stop a descent onto a profile bar. The containment test against these
# polygons is the ONLY safeguard. An `openings: []` entry means "hole unknown" and
# makes every tool fall back to the shallow, current-behaviour grasp height.
#
# HOW TO MEASURE:
#   python3 ros_unrelated_scripts/tray_opening_calib.py --tray instrument
# Click the four INNER corners of the profile frame; it ray-casts them onto
# plane_z and prints the YAML. Restart it afterwards to see the stored polygon
# reprojected onto the live image — it must sit on the real profiles.
# Then verify physically with tcp_probe.py before enabling any deep grasp.

trays:

  instrument_tray:
    # Profile top surface. Must match fixed_tool_plane_z_m in jetson_launch.py.
    plane_z: 0.044

    # Systematic bias of everything this tray's camera reports, in world XY.
    # ADDED to every projected point (so it is the NEGATIVE of the observed error).
    # Applied by tool_detection_node AND by tray_opening_calib.py, so the polygon
    # below and the tool grasp points always live in the same, corrected frame —
    # the robot's.
    world_offset_xy: [0.0, 0.0]

    # Lateral SCALE correction about xy_pivot, applied AFTER world_offset_xy.
    # The camera is mounted close and oblique; its ArUco-locked pose carries a
    # small scale error that is ~0 at the tray centre (the nadir) and grows toward
    # the edges — a tool at the far +x end lands several cm toward the centre. This
    # reverses it: world_xy = pivot + scale * (world_xy - pivot). Applied by
    # tool_detection_node AND tray_opening_calib.py so polygon and grasps stay in
    # one frame. Measure scale from physical(read_stage_pose) vs perceived
    # (body_center_3d) pairs across the tray; pivot = the tray centre where grasps
    # are already perfect. scale = physical/perceived (right pair: 0.342/0.288).
    # DISABLED (1.0): superseded by the FIXED camera pose (aruco_markers.yaml,
    # marker 110, hardcoded_world_pose). The lateral scale here was a band-aid for
    # the drifting ArUco lock — it could never hold because the underlying pose
    # kept moving. With the pose measured once and hardcoded, the projection is
    # accurate directly. Only re-introduce a scale if, AFTER the pose calibration,
    # a residual is still measured across the tray.
    xy_scale: [1.0, 1.0]
    xy_pivot: [0.0, 0.0]

    # Inner edge of the profile frame, world XY, walking around the rim.
    # A long narrow SLOT: ~665 mm along x, only ~64 mm across in y. Consequence:
    # a tool lying ACROSS the slot can be grasped deep (the fingers straddle it
    # along the slot, where there is room), but a tool lying ALONG the slot cannot
    # — the 65 mm-wide gripper does not fit beside it in a 64 mm gap. Those stay
    # shallow, which is correct.
    openings:
      - name: main
        polygon: [[0.3951, 0.3253], [-0.4013, 0.3227], [-0.3995, 0.3878], [0.3978, 0.3873]]

    # How far the grasp point AND both fingertips must stay from a polygon edge.
    # The profiles are stepped down a little at some edges, so the collision risk
    # is low and 5 mm is enough. Raise this if a fingertip ever grazes a profile.
    edge_margin_m: 0.005

  reclaim_tray:
    plane_z: -0.137

    # Measured: the robot drives ~10 mm too far in +x when sent to a grasp point
    # from this camera, so it reports x ~10 mm too large. The ArUco marker 105
    # pose is NOT the culprit (its x=0 / y=-0.44 are measured and correct) — the
    # residual comes from solvePnP on this camera's oblique SIDE view plus the
    # projection ignoring the lens distortion coefficients. Compensate it here.
    world_offset_xy: [-0.010, 0.0]

    # Lateral scale correction about xy_pivot — see instrument_tray above. Not yet
    # measured for the reclaim camera; leave at 1.0 until measured the same way.
    xy_scale: [1.0, 1.0]
    xy_pivot: [0.0, 0.0]

    # Side camera: you see the profile's inner WALL, not just its top edge. Click
    # too low on the wall and the ray lands behind the true inner corner, making
    # the hole look BIGGER than it is — the error direction that drives the
    # gripper into the profile. Click the TOP inner edge, cross-check with
    # tcp_probe.py.
    #
    # NOTE: this polygon has already been corrected by world_offset_xy above (it
    # was clicked before the offset existed, so it carried the same +10 mm bias).
    # Re-measuring it now with tray_opening_calib.py yields these numbers directly.
    openings:
      - name: main
        polygon: [[0.1197, -0.3313], [0.1214, -0.4000], [0.3915, -0.4125], [0.3926, -0.3420]]

    edge_margin_m: 0.005
